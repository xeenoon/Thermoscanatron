[project]
name = "segkit"
version = "0.1.0"
description = "ROI-crop segmentation models (HandSegNet, later PanelSegNet) for on-phone inference"
readme = "README.md"
authors = [
    { name = "xeenoon", email = "ccw100asdf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "executorch>=1.5.1",
    "matplotlib>=3.11.2",
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rembg>=2.0.69",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.21.0",
    "timm>=1.0.30",
    "tqdm>=4.66.5",
]

# Pick the torch + onnxruntime builds per machine: `uv sync --extra cpu` (laptop) or `uv sync --extra cu130`
# (NVIDIA GPU). onnxruntime and onnxruntime-gpu install the same package dir, so only one may be present.
[project.optional-dependencies]
cpu = ["torch>=2.14.1", "torchvision>=0.29.1", "rembg[cpu]>=2.0.69"]
cu130 = ["torch>=2.14.1", "torchvision>=0.29.1", "rembg[gpu]>=2.0.69"]

[project.scripts]
segkit-hello-world = "segkit.hello_world:main"
segkit-eval = "segkit.eval.cli:main"
segkit-label = "segkit.label_rembg:main"
segkit-extract = "segkit.extract_frames:main"
segkit-validate = "segkit.validate_dataset:main"
segkit-train = "segkit.train:main"
segkit-report = "segkit.report:main"
segkit-diagnose = "segkit.diagnose:main"
segkit-test = "segkit.test_set:main"
segkit-negatives = "segkit.negatives:main"
segkit-panel-label = "segkit.panel.label:main"
segkit-panel-train = "segkit.panel.train:main"
segkit-panel-track = "segkit.panel.track:main"
segkit-panel-thermal = "segkit.panel.thermal:main"
segkit-panel-twotier = "segkit.panel.twotier:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
